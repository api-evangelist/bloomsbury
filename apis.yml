aid: bloomsbury
name: Bloomsbury
description: >-
  Bloomsbury AI was a London-based natural-language-processing startup, backed
  by Seedcamp, that built Cape — an API making it easy to build software that
  answers questions about the contents of documents (machine reading /
  document question answering). Bloomsbury AI was acquired by Facebook in 2018;
  the hosted Cape API is terminated and bloomsbury.ai now serves only a
  farewell page. The team open sourced the Cape stack (web services, document
  QA, machine reader, and clients) under the bloomsburyai GitHub organization,
  which remains publicly available as archival source. This API Evangelist
  profile preserves that identity and the open-source footprint.
